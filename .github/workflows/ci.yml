name: CI

on: [push, pull_request]

jobs:
  checks:
    # 这套工具链本身就是 Windows 专用：脚本用 ctypes.windll 调 Win32 窗口接口去读
    # Proteus 的状态栏。Linux 上没有 windll，离线自检会在 import 阶段就崩，
    # 所以必须在 Windows 上验，不能用 Linux runner 假装跑过。
    runs-on: windows-latest
    env:
      # GitHub 的 Windows runner 是英文区域，Python 往**管道**写输出时默认走 ANSI 代码页
      # （1252），而这些脚本的 argparse 帮助与 JSON 报错里都是中文，一打印就 UnicodeEncodeError、
      # 整个 CLI 以退出码 1 崩掉。这里显式声明 UTF-8，让 CI 的编码环境是确定的，
      # 而不是随 runner 的区域设置变化。
      PYTHONUTF8: '1'
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m compileall -q scripts
      # 离线自检：零外部依赖（不需要 Proteus / Keil / pywin32 / Pillow）。
      # 任何断言失败 -> 退出码 1，闸门变红；不允许「跳过即通过」。
      - name: 离线自检（零外部依赖）
        run: python scripts/selftest.py
